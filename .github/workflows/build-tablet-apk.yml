name: Build Android Tablet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Compile Sideloadable Tablet APK
    runs-on: ubuntu-latest
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept preinstalled Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: |
          npm install
          npm install expo-asset@~11.0.5

      - name: Generate native Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Standalone Release APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy APK to friendly filename
        run: cp android/app/build/outputs/apk/release/app-release.apk ./gridiron-dynasty-tablet.apk

      - name: Upload Tablet APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridiron-dynasty-tablet-apk
          path: ./gridiron-dynasty-tablet.apk
          retention-days: 30
