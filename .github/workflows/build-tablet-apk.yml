      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Standalone Release APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy APK to friendly filename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./gridiron-dynasty-tablet.apk

      - name: Upload Tablet APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridiron-dynasty-tablet-apk
          path: ./gridiron-dynasty-tablet.apk
          retention-days: 30
